name: mingrr
description: "MINGRR - 반려동물 커뮤니티 앱 (데이팅, 산책, 교배, 중고거래)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ===== Firebase 관련 =====
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1
  firebase_storage: ^12.3.7
  firebase_messaging: ^15.1.6

  # ===== 소셜 로그인 =====
  google_sign_in: ^6.2.2
  # kakao_flutter_sdk: ^1.9.6  # 나중에 네이티브 설정 후 활성화
  # flutter_naver_login: ^1.8.0  # 나중에 네이티브 설정 후 활성화

  # ===== 상태 관리 =====
  flutter_riverpod: ^2.6.1

  # ===== 위치 기반 =====
  geolocator: ^13.0.2
  kakao_map_sdk: ^1.2.3  # 네이티브 카카오맵 SDK (폴리라인/마커 지원)
  # geoflutterfire_plus: ^0.0.28  # 위치 기반 쿼리

  # ===== UI/UX =====
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  flutter_native_splash: ^2.4.4
  flutter_launcher_icons: ^0.14.3
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  carousel_slider: ^5.0.0
  fl_chart: ^0.69.2

  # ===== 유틸리티 =====
  intl: ^0.20.1
  shared_preferences: ^2.3.4
  uuid: ^4.5.1
  go_router: ^14.6.2
  equatable: ^2.0.7
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4
  path_provider: ^2.1.5
  http: ^1.2.0
  url_launcher: ^6.2.5
  package_info_plus: ^8.0.0
  flutter_cache_manager: ^3.3.2
  video_player: ^2.10.1
  video_thumbnail: ^0.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  freezed: ^2.5.7

flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/
    - assets/images/
  
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.ttf
        - asset: assets/fonts/Pretendard-Medium.ttf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.ttf
          weight: 700
