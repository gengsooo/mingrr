    <linearGradient id="dogCream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE0B2"/>
      <stop offset="100%" style="stop-color:#FFCC80"/>
    </linearGradient>
    <filter id="shadowGroup" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- 배경 -->
  <circle cx="140" cy="140" r="130" fill="url(#bgGroup)"/>
  <circle cx="140" cy="140" r="115" fill="white" fill-opacity="0.4"/>
  
  <!-- 장식 원들 -->
  <circle cx="45" cy="70" r="8" fill="#CE93D8" fill-opacity="0.5"/>
