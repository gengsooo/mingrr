<svg width="280" height="280" viewBox="0 0 280 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgWalk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F5E9"/>
      <stop offset="100%" style="stop-color:#C8E6C9"/>
    </linearGradient>
    <linearGradient id="pathGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#66BB6A"/>
      <stop offset="100%" style="stop-color:#43A047"/>
    </linearGradient>
    <linearGradient id="dogWalk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB74D"/>
      <stop offset="100%" style="stop-color:#FF9800"/>
    </linearGradient>
    <filter id="shadowWalk" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- 배경 -->
  <circle cx="140" cy="140" r="130" fill="url(#bgWalk)"/>
  <circle cx="140" cy="140" r="115" fill="white" fill-opacity="0.4"/>
  
  <!-- 잔디/자연 요소 -->
  <ellipse cx="50" cy="220" rx="30" ry="15" fill="#81C784" fill-opacity="0.5"/>
  <ellipse cx="230" cy="210" rx="25" ry="12" fill="#81C784" fill-opacity="0.5"/>
  <ellipse cx="140" cy="240" rx="80" ry="25" fill="#A5D6A7" fill-opacity="0.4"/>
  
  <!-- 산책 경로 -->
  <g filter="url(#shadowWalk)">
    <path d="M60 180 Q90 120 140 130 Q190 140 220 100" stroke="url(#pathGrad)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M60 180 Q90 120 140 130 Q190 140 220 100" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="12 8" opacity="0.6"/>
  </g>
  
  <!-- 시작점 -->
  <g filter="url(#shadowWalk)">
    <circle cx="60" cy="180" r="14" fill="#4CAF50"/>
    <circle cx="60" cy="180" r="8" fill="white"/>
    <circle cx="60" cy="180" r="4" fill="#4CAF50"/>
  </g>
  
  <!-- 끝점 (깃발) -->
  <g filter="url(#shadowWalk)">
    <rect x="217" y="70" width="4" height="35" rx="2" fill="#5D4037"/>
    <path d="M221 70 L245 80 L221 90 Z" fill="#FF5722"/>
  </g>
  
  <!-- 걷는 강아지 -->
  <g filter="url(#shadowWalk)" transform="translate(100, 150)">
    <!-- 몸통 -->
    <ellipse cx="40" cy="35" rx="35" ry="22" fill="url(#dogWalk)"/>
    <!-- 꼬리 -->
    <path d="M75 30 Q90 15 85 35" stroke="#F57C00" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- 다리 -->
    <rect x="15" y="50" width="10" height="20" rx="5" fill="#F57C00"/>
    <rect x="30" y="52" width="10" height="18" rx="5" fill="#FF9800"/>
    <rect x="50" y="50" width="10" height="20" rx="5" fill="#F57C00"/>
    <rect x="65" y="52" width="10" height="18" rx="5" fill="#FF9800"/>
    <!-- 머리 -->
    <circle cx="10" cy="25" r="22" fill="url(#dogWalk)"/>
    <!-- 귀 -->
    <ellipse cx="-5" cy="8" rx="10" ry="18" fill="#F57C00" transform="rotate(-20 -5 8)"/>
    <ellipse cx="25" cy="8" rx="10" ry="18" fill="#F57C00" transform="rotate(20 25 8)"/>
    <!-- 얼굴 -->
    <ellipse cx="5" cy="30" rx="12" ry="10" fill="#FFF8E1"/>
    <!-- 눈 -->
    <ellipse cx="0" cy="22" rx="5" ry="6" fill="white"/>
    <ellipse cx="18" cy="22" rx="5" ry="6" fill="white"/>
    <circle cx="2" cy="23" r="3" fill="#3E2723"/>
    <circle cx="20" cy="23" r="3" fill="#3E2723"/>
    <circle cx="3" cy="22" r="1.5" fill="white"/>
    <circle cx="21" cy="22" r="1.5" fill="white"/>
    <!-- 코 -->
    <ellipse cx="8" cy="32" rx="5" ry="4" fill="#5D4037"/>
    <!-- 입 (웃는 표정) -->
    <path d="M2 38 Q8 44 14 38" stroke="#5D4037" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- 혀 -->
    <ellipse cx="8" cy="42" rx="4" ry="5" fill="#F48FB1"/>
    <!-- 볼터치 -->
    <circle cx="-8" cy="28" r="4" fill="#FFAB91" fill-opacity="0.5"/>
    <circle cx="24" cy="28" r="4" fill="#FFAB91" fill-opacity="0.5"/>
  </g>
  
  <!-- 발자국들 -->
  <g fill="#81C784" opacity="0.6">
    <ellipse cx="70" cy="200" rx="6" ry="5"/>
    <circle cx="64" cy="193" r="2.5"/>
    <circle cx="70" cy="191" r="2.5"/>
    <circle cx="76" cy="193" r="2.5"/>
  </g>
  <g fill="#81C784" opacity="0.5">
    <ellipse cx="95" cy="185" rx="5" ry="4"/>
    <circle cx="90" cy="179" r="2"/>
    <circle cx="95" cy="177" r="2"/>
    <circle cx="100" cy="179" r="2"/>
  </g>
  
  <!-- 나무/자연 요소 -->
  <g opacity="0.7">
    <rect x="235" y="160" width="8" height="30" rx="2" fill="#8D6E63"/>
    <circle cx="239" cy="150" r="18" fill="#66BB6A"/>
    <circle cx="230" cy="158" r="12" fill="#81C784"/>
    <circle cx="248" cy="158" r="12" fill="#81C784"/>
  </g>
  
  <!-- 태양 -->
  <circle cx="50" cy="50" r="20" fill="#FFD54F" opacity="0.8"/>
  <circle cx="50" cy="50" r="14" fill="#FFEB3B"/>
  
  <!-- 구름 -->
  <g fill="white" opacity="0.7">
    <ellipse cx="200" cy="45" rx="20" ry="10"/>
    <ellipse cx="185" cy="50" rx="12" ry="8"/>
    <ellipse cx="215" cy="50" rx="12" ry="8"/>
  </g>
</svg>
