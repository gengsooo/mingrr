<svg width="280" height="280" viewBox="0 0 280 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgStart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8E1"/>
      <stop offset="100%" style="stop-color:#FFECB3"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#66BB6A"/>
      <stop offset="100%" style="stop-color:#43A047"/>
    </linearGradient>
    <linearGradient id="dogStart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB74D"/>
      <stop offset="100%" style="stop-color:#FF9800"/>
    </linearGradient>
    <filter id="shadowStart" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 배경 -->
  <circle cx="140" cy="140" r="130" fill="url(#bgStart)"/>
  <circle cx="140" cy="140" r="115" fill="white" fill-opacity="0.5"/>
  
  <!-- 장식 원들 -->
  <circle cx="45" cy="60" r="8" fill="#FFE082" fill-opacity="0.6"/>
  <circle cx="235" cy="55" r="6" fill="#FFE082" fill-opacity="0.6"/>
  <circle cx="40" cy="180" r="5" fill="#FFCC80" fill-opacity="0.5"/>
  <circle cx="240" cy="175" r="7" fill="#FFCC80" fill-opacity="0.5"/>
  
  <!-- 발바닥 로고 (밍그르르) -->
  <g filter="url(#shadowStart)" transform="translate(95, 45)">
    <ellipse cx="45" cy="50" rx="35" ry="28" fill="url(#checkGrad)"/>
    <ellipse cx="20" cy="25" rx="12" ry="14" fill="url(#checkGrad)"/>
    <ellipse cx="45" cy="18" rx="12" ry="14" fill="url(#checkGrad)"/>
    <ellipse cx="70" cy="25" rx="12" ry="14" fill="url(#checkGrad)"/>
    <!-- 체크마크 -->
    <path d="M30 48 L42 60 L62 38" stroke="white" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- 행복한 강아지 -->
  <g filter="url(#shadowStart)">
    <!-- 몸통 -->
    <ellipse cx="140" cy="225" rx="40" ry="25" fill="url(#dogStart)"/>
    <!-- 앞발 -->
    <ellipse cx="110" cy="240" rx="12" ry="8" fill="#F57C00"/>
    <ellipse cx="170" cy="240" rx="12" ry="8" fill="#F57C00"/>
    <!-- 머리 -->
    <circle cx="140" cy="175" r="38" fill="url(#dogStart)"/>
    <!-- 귀 -->
    <ellipse cx="108" cy="145" rx="14" ry="25" fill="#F57C00" transform="rotate(-15 108 145)"/>
    <ellipse cx="172" cy="145" rx="14" ry="25" fill="#F57C00" transform="rotate(15 172 145)"/>
    <!-- 얼굴 -->
    <ellipse cx="140" cy="185" rx="20" ry="16" fill="#FFF8E1"/>
    <!-- 눈 (행복한 ^^ 표정) -->
    <path d="M122 168 Q128 160 134 168" stroke="#3E2723" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M146 168 Q152 160 158 168" stroke="#3E2723" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- 코 -->
    <ellipse cx="140" cy="182" rx="6" ry="5" fill="#5D4037"/>
    <ellipse cx="140" cy="180" rx="2" ry="1" fill="#8D6E63"/>
    <!-- 입 (크게 웃는) -->
    <path d="M125 195 Q140 212 155 195" stroke="#5D4037" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- 혀 -->
    <ellipse cx="140" cy="202" rx="8" ry="10" fill="#F48FB1"/>
    <!-- 볼터치 -->
    <circle cx="110" cy="180" r="8" fill="#FFAB91" fill-opacity="0.6"/>
    <circle cx="170" cy="180" r="8" fill="#FFAB91" fill-opacity="0.6"/>
  </g>
  
  <!-- 하트들 -->
  <g filter="url(#glow)">
    <path d="M60 100 C55 93 43 93 43 105 C43 117 60 130 60 130 C60 130 77 117 77 105 C77 93 65 93 60 100" fill="#E91E63"/>
    <path d="M220 100 C215 93 203 93 203 105 C203 117 220 130 220 130 C220 130 237 117 237 105 C237 93 225 93 220 100" fill="#E91E63"/>
  </g>
  
  <!-- 작은 하트들 -->
  <path d="M80 160 C78 157 73 157 73 161 C73 165 80 170 80 170 C80 170 87 165 87 161 C87 157 82 157 80 160" fill="#F48FB1" opacity="0.8"/>
  <path d="M200 155 C198 152 193 152 193 156 C193 160 200 165 200 165 C200 165 207 160 207 156 C207 152 202 152 200 155" fill="#F48FB1" opacity="0.8"/>
  
  <!-- 반짝이 별 -->
  <g fill="#FFC107">
    <path d="M50 130 L52 135 L57 135 L53 138 L55 143 L50 140 L45 143 L47 138 L43 135 L48 135 Z"/>
    <path d="M230 125 L232 130 L237 130 L233 133 L235 138 L230 135 L225 138 L227 133 L223 130 L228 130 Z"/>
    <path d="M140 255 L142 259 L146 259 L143 262 L145 266 L140 263 L135 266 L137 262 L134 259 L138 259 Z" opacity="0.8"/>
  </g>
  
  <!-- 반짝이 원 -->
  <circle cx="75" cy="70" r="4" fill="#FFC107" opacity="0.8"/>
  <circle cx="205" cy="65" r="3" fill="#FFC107" opacity="0.8"/>
  <circle cx="55" cy="200" r="3" fill="#FFE082" opacity="0.7"/>
  <circle cx="225" cy="195" r="4" fill="#FFE082" opacity="0.7"/>
</svg>
