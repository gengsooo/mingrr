  <path d="M210 205 C208 202 203 202 203 206 C203 210 210 214 210 214 C210 214 217 210 217 206 C217 202 212 202 210 205" fill="#CE93D8" fill-opacity="0.7"/>
  
  <!-- 반짝이 -->
  <g fill="#FFC107">
